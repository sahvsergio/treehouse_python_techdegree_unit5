{% extends 'layout.html' %} 

{% block content %}
<section class="header project-detail-header">
  <h1>{{project.title}}</h1>
  <p class="project-date">QUEST DATE: {{project.date}}</p>
  
  <a href="{{project.url}}" class="github-btn" target="_blank">
    <i class="fab fa-github"></i>
    VIEW ON GITHUB
  </a>

  <div class="project-skills-wrapper">
    <h3>SKILLS PRACTICED</h3>
    <ul class="project-skills">
       {% for skill in project.skills_practiced.split(',') %}
        <li>{{skill.strip()}}</li>
       {% endfor %}
    </ul>
  </div>
</section>

<section id="project-desc">
  <div id="triangle5"></div>
  <h2>DESCRIPTION</h2>
  <p>{{project.description}}</p>
  <div id="triangle6"></div>
</section>


{% endblock content %}
